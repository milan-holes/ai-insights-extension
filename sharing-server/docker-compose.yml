services:
  sharing-server:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - PORT=3000
      - DATA_DIR=/data
      # Optional: only allow uploads from members of this GitHub org.
      - ALLOWED_GITHUB_ORG=${ALLOWED_GITHUB_ORG:-}
      # Optional: snapshots older than this many hours are removed.
      - SNAPSHOT_TTL_HOURS=${SNAPSHOT_TTL_HOURS:-72}
    volumes:
      - sharing-data:/data

volumes:
  sharing-data:
